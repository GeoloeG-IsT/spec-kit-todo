apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: todo-backend
  namespace: default
  labels:
    app: todo-backend
    environment: production
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
    run.googleapis.com/cpu-throttling: "true"
    run.googleapis.com/startup-cpu-boost: "false"
spec:
  template:
    metadata:
      labels:
        app: todo-backend
        version: "1.0"
      annotations:
        # Scaling
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "100"
        autoscaling.knative.dev/target: "70"

        # Performance
        run.googleapis.com/memory: "512Mi"
        run.googleapis.com/cpu: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"

        # Timeouts
        run.googleapis.com/timeout: "300s"

        # Security
        run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/REGION/connectors/todo-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only

    spec:
      containerConcurrency: 1000
      timeoutSeconds: 300
      serviceAccountName: todo-backend-sa
      containers:
        - name: todo-backend
          image: REGION-docker.pkg.dev/PROJECT_ID/todo-app/todo-backend:latest
          ports:
            - name: http1
              containerPort: 8000
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "8000"
            - name: CORS_ORIGINS
              value: "https://todo-frontend-HASH-uc.a.run.app,https://todolist.yourdomain.com"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONPATH
              value: "/app"

          envFrom:
            - secretRef:
                name: todo-backend-secrets

          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 10

  traffic:
    - percent: 100
      latestRevision: true