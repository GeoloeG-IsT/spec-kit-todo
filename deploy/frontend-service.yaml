apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: todo-frontend
  namespace: default
  labels:
    app: todo-frontend
    environment: production
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
    run.googleapis.com/cpu-throttling: "true"
    run.googleapis.com/startup-cpu-boost: "false"
spec:
  template:
    metadata:
      labels:
        app: todo-frontend
        version: "1.0"
      annotations:
        # Scaling
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "50"
        autoscaling.knative.dev/target: "70"

        # Performance
        run.googleapis.com/memory: "512Mi"
        run.googleapis.com/cpu: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"

        # Timeouts
        run.googleapis.com/timeout: "300s"

    spec:
      containerConcurrency: 1000
      timeoutSeconds: 300
      serviceAccountName: todo-frontend-sa
      containers:
        - name: todo-frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/todo-app/todo-frontend:latest
          ports:
            - name: http1
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"

          envFrom:
            - secretRef:
                name: todo-frontend-secrets

          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 10

  traffic:
    - percent: 100
      latestRevision: true