name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker/backend.Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: todo-backend
  IMAGE_NAME: todo-backend

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up test environment
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          CLERK_SECRET_KEY: sk_test_dummy_key_for_testing
          CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_testing
        run: |
          # Run database migrations
          alembic upgrade head

      - name: Run contract tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          CLERK_SECRET_KEY: sk_test_dummy_key_for_testing
          CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_testing
        run: |
          python -m pytest tests/contract/ -v --tb=short

      - name: Run integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          CLERK_SECRET_KEY: sk_test_dummy_key_for_testing
          CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_testing
        run: |
          python -m pytest tests/integration/ -v --tb=short

      - name: Run unit tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          CLERK_SECRET_KEY: sk_test_dummy_key_for_testing
          CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_testing
        run: |
          python -m pytest tests/unit/ -v --tb=short

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            -f docker/backend.Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/todo-app/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/todo-app/${{ env.IMAGE_NAME }}:latest \
            ./backend

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/todo-app/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/todo-app/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/todo-app/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 1000 \
            --timeout 300 \
            --max-instances 100 \
            --min-instances 0 \
            --port 8000 \
            --set-env-vars "ENVIRONMENT=production" \
            --set-secrets "DATABASE_URL=database-url:latest" \
            --set-secrets "CLERK_SECRET_KEY=clerk-secret-key:latest" \
            --set-secrets "CLERK_PUBLISHABLE_KEY=clerk-publishable-key:latest" \
            --execution-environment gen2 \
            --cpu-throttling \
            --no-cpu-boost

      - name: Update traffic to new revision
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-latest \
            --region ${{ env.REGION }}

      - name: Get service URL
        id: url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Backend deployed to: $SERVICE_URL"

      - name: Run health check
        run: |
          # Wait for deployment to be ready
          sleep 30

          # Health check
          curl -f ${{ steps.url.outputs.SERVICE_URL }}/health || exit 1
          echo "Health check passed!"

      - name: Run smoke tests
        run: |
          # Basic API endpoint tests
          curl -f ${{ steps.url.outputs.SERVICE_URL }}/docs || exit 1
          echo "API documentation accessible!"

  notify:
    name: Notify Deployment Status
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Backend deployment successful!"
          echo "Service URL: ${{ needs.deploy.outputs.SERVICE_URL }}"

      - name: Notify Failure
        if: needs.deploy.result == 'failure' || needs.test.result == 'failure'
        run: |
          echo "❌ Backend deployment failed!"
          echo "Please check the logs and fix the issues."
          exit 1